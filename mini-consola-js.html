<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniConsola JS — Practica JavaScript</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --panel-border: #3c3c3c;
      --accent: #007acc;
      --accent-hover: #1f8ad2;
      --text: #d4d4d4;
      --muted: #8a8a8a;
      --console-bg: #1e1e1e;
      --console-text: #dcdcdc;
      --log: #dcdcdc;
      --info: #4fc3f7;
      --warn: #ffb74d;
      --error: #f48771;
      --ok: #81c784;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: #2d2d30;
      border-bottom: 1px solid var(--panel-border);
      flex: 0 0 auto;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.3px;
    }

    header h1 .js {
      color: #f7df1e;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.secondary {
      background: #3a3d41;
    }

    button.secondary:hover {
      background: #4a4d51;
    }

    main {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
    }

    .pane {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .pane-label {
      flex: 0 0 auto;
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      background: #2d2d30;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pane + .pane {
      border-left: 1px solid var(--panel-border);
    }

    #editor {
      flex: 1 1 auto;
      width: 100%;
      border: none;
      background: var(--panel);
      color: var(--text);
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      font-size: 14px;
      line-height: 1.5;
      padding: 12px 14px;
      resize: none;
      outline: none;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }

    #editor::selection {
      background: #264f78;
    }

    #console {
      flex: 1 1 auto;
      background: var(--console-bg);
      color: var(--console-text);
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      font-size: 13.5px;
      line-height: 1.5;
      padding: 10px 14px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #console .line {
      padding: 1px 0;
    }

    #console .prompt {
      color: #888;
      user-select: none;
      margin-right: 6px;
    }

    .console-line { color: var(--log); }
    .console-info { color: var(--info); }
    .console-warn { color: var(--warn); }
    .console-error { color: var(--error); }
    .console-error .prompt { color: var(--error); }
    .console-ok { color: var(--ok); }
    .console-meta { color: var(--muted); font-style: italic; }

    footer {
      flex: 0 0 auto;
      padding: 6px 14px;
      font-size: 11px;
      color: var(--muted);
      background: #2d2d30;
      border-top: 1px solid var(--panel-border);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    kbd {
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 0 5px;
      font-family: inherit;
      font-size: 11px;
    }

    @media (max-width: 720px) {
      main { flex-direction: column; }
      .pane + .pane { border-left: none; border-top: 1px solid var(--panel-border); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mini<span class="js">JS</span> — Práctica de JavaScript</h1>
    <div class="toolbar">
      <button id="runBtn" title="Ejecutar el código (Ctrl+Enter)">▶ Ejecutar</button>
      <button id="clearBtn" class="secondary" title="Borrar la consola">Limpiar</button>
      <button id="examplesBtn" class="secondary" title="Ejemplos">Ejemplos</button>
    </button>
  </header>

  <main>
    <section class="pane">
      <div class="pane-label">
        <span>editor.js</span>
        <span>Ctrl+Enter para ejecutar</span>
      </div>
      <textarea id="editor" spellcheck="false" autocomplete="off"
        autocorrect="off" autocapitalize="off"></textarea>
    </section>

    <section class="pane">
      <div class="pane-label">
        <span>consola</span>
        <span>salida como Node.js</span>
      </div>
      <pre id="console"></pre>
    </section>
  </main>

  <footer>
    <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> Ejecutar</span>
    <span><kbd>Tab</kbd> inserta dos espacios</span>
    <span>Hecho para el módulo de Desarrollo Web en Entorno Cliente</span>
  </footer>

  <script>
    "use strict";

    const editor = document.getElementById("editor");
    const consoleEl = document.getElementById("console");
    const runBtn = document.getElementById("runBtn");
    const clearBtn = document.getElementById("clearBtn");
    const examplesBtn = document.getElementById("examplesBtn");

    const PROMPT = "›";

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatArg(value, seen) {
      seen = seen || new Set();
      if (value === undefined) return "undefined";
      if (value === null) return "null";
      const type = typeof value;
      if (type === "string") return value;
      if (type === "number" || type === "bigint" || type === "boolean") return String(value);
      if (type === "symbol") return value.toString();
      if (type === "function") {
        const name = value.name || "anonymous";
        return `[Function: ${name}]`;
      }
      if (type === "object") {
        if (seen.has(value)) return "[Circular]";
        seen.add(value);
        try {
          if (value instanceof Error) return `${value.name}: ${value.message}`;
          if (Array.isArray(value)) {
            const items = value.map((v) => formatArg(v, seen));
            return "[ " + items.join(", ") + (value.length > 0 ? " " : "") + "]";
          }
          if (value instanceof Map) {
            const entries = [...value.entries()].map(
              ([k, v]) => `${formatArg(k, seen)} => ${formatArg(v, seen)}`
            );
            return `Map(${value.size}) { ${entries.join(", ")} }`;
          }
          if (value instanceof Set) {
            const entries = [...value.values()].map((v) => formatArg(v, seen));
            return `Set(${value.size}) { ${entries.join(", ")} }`;
          }
          if (value instanceof Date) return value.toISOString();
          if (value instanceof RegExp) return value.toString();
          const keys = Object.keys(value);
          const pairs = keys.map(
            (k) => `${k}: ${formatArg(value[k], seen)}`
          );
          const ctor = value.constructor && value.constructor.name
            ? value.constructor.name
            : "Object";
          if (pairs.length === 0) return ctor === "Object" ? "{}" : `${ctor} {}`;
          return ctor === "Object"
            ? "{ " + pairs.join(", ") + " }"
            : `${ctor} { ${pairs.join(", ")} }`;
        } catch (e) {
          return "[object]";
        }
      }
      return String(value);
    }

    function appendLine(text, className) {
      const div = document.createElement("div");
      div.className = "line " + (className || "");
      const prompt = document.createElement("span");
      prompt.className = "prompt";
      prompt.textContent = PROMPT;
      div.appendChild(prompt);
      const span = document.createElement("span");
      span.innerHTML = escapeHtml(text);
      div.appendChild(span);
      consoleEl.appendChild(div);
      consoleEl.scrollTop = consoleEl.scrollHeight;
      return div;
    }

    function appendRaw(text, className) {
      const div = document.createElement("div");
      div.className = "line " + (className || "");
      div.innerHTML = escapeHtml(text);
      consoleEl.appendChild(div);
      consoleEl.scrollTop = consoleEl.scrollHeight;
      return div;
    }

    function clearConsole() {
      consoleEl.innerHTML = "";
    }

    function makeConsole() {
      const formatArgs = (args) => args.map((a) => formatArg(a)).join(" ");
      const c = {
        log: (...args) => appendLine(formatArgs(args), "console-line"),
        info: (...args) => appendLine(formatArgs(args), "console-info"),
        debug: (...args) => appendLine(formatArgs(args), "console-line"),
        warn: (...args) => appendLine(formatArgs(args), "console-warn"),
        error: (...args) => appendLine(formatArgs(args), "console-error"),
        table: (data) => {
          try {
            if (Array.isArray(data)) {
              data.forEach((row, i) =>
                appendLine(`${i}: ${formatArg(row)}`, "console-line")
              );
            } else if (data && typeof data === "object") {
              Object.entries(data).forEach(([k, v]) =>
                appendLine(`${k}: ${formatArg(v)}`, "console-line")
              );
            } else {
              appendLine(formatArg(data), "console-line");
            }
          } catch (e) {
            c.log(data);
          }
        },
        group: (...args) => appendLine(formatArgs(args) || "Group", "console-info"),
        groupEnd: () => {},
        time: () => {},
        timeEnd: () => {},
        assert: (cond, ...args) => {
          if (!cond) c.error("Assertion failed:", ...args);
        },
        dir: (obj) => appendLine(formatArg(obj), "console-line"),
        count: () => {},
        trace: (...args) => appendLine(formatArgs(args), "console-info"),
        clear: clearConsole,
      };
      return c;
    }

    function runCode() {
      const code = editor.value;
      clearConsole();
      const sandboxConsole = makeConsole();

      try {
        const runner = new Function("console", '"use strict";\n' + code);
        runner(sandboxConsole);
      } catch (err) {
        appendLine(`${err.name}: ${err.message}`, "console-error");
        if (err.stack) {
          const stack = err.stack.split("\n").slice(1, 4).join("\n");
          if (stack) appendRaw(stack, "console-error");
        }
      }
    }

    const EXAMPLES = {
      "Hola mundo": `// Hola mundo
console.log("Hola, alumnos!");
console.log("Bienvenidos al módulo de Desarrollo Web en Entorno Cliente");`,

      "Variables y tipos": `// Variables y tipos de datos
let nombre = "Ana";
const edad = 20;
let activo = true;
let nada = null;
let noDefinido;

console.log(nombre, "-", typeof nombre);
console.log(edad, "-", typeof edad);
console.log(activo, "-", typeof activo);
console.log(nada, "-", typeof nada);
console.log(noDefinido, "-", typeof noDefinido);`,

      "Operaciones aritméticas": `// Operaciones básicas
let a = 10;
let b = 3;

console.log("Suma:", a + b);
console.log("Resta:", a - b);
console.log("Multiplicación:", a * b);
console.log("División:", a / b);
console.log("Resto:", a % b);
console.log("Potencia:", a ** b);`,

      "Estructuras de control": `// Condicionales y bucles
let nota = 7;

if (nota >= 9) {
  console.log("Sobresaliente");
} else if (nota >= 5) {
  console.log("Aprobado");
} else {
  console.log("Suspenso");
}

console.log("--- Contando del 1 al 5 ---");
for (let i = 1; i <= 5; i++) {
  console.log("i =", i);
}`,

      "Arrays": `// Arrays
let frutas = ["manzana", "pera", "naranja"];

console.log("Array completo:", frutas);
console.log("Primer elemento:", frutas[0]);
console.log("Número de elementos:", frutas.length);

frutas.push("uva");
console.log("Tras push:", frutas);

frutas.forEach((fruta, i) => console.log(i, "->", fruta));`,

      "Objetos": `// Objetos
let alumno = {
  nombre: "Carlos",
  edad: 21,
  modulo: "DAW",
  activo: true
};

console.log(alumno);
console.log("Nombre:", alumno.nombre);
console.log("Edad:", alumno["edad"]);

alumno.nota = 8;
console.log("Objeto actualizado:", alumno);`,

      "Funciones": `// Funciones
function saludar(nombre) {
  return "Hola, " + nombre + "!";
}

const sumar = (a, b) => a + b;

console.log(saludar("María"));
console.log("2 + 3 =", sumar(2, 3));

// Recursividad: factorial
function factorial(n) {
  if (n <= 1) return 1;
  return n * factorial(n - 1);
}

console.log("5! =", factorial(5));`,

      "Manejo de errores": `// try / catch
try {
  let x = y + 1; // 'y' no está definida
} catch (error) {
  console.error("Capturado un error:", error.message);
}

console.log("La ejecución continúa normalmente");`,
    };

    function showExamples() {
      const names = Object.keys(EXAMPLES);
      const msg =
        "Elige un ejemplo por número:\n\n" +
        names.map((n, i) => `${i + 1}. ${n}`).join("\n") +
        "\n\n(Cancelar = vacío)";
      const choice = prompt(msg);
      if (choice === null || choice.trim() === "") return;
      const idx = parseInt(choice.trim(), 10) - 1;
      if (isNaN(idx) || idx < 0 || idx >= names.length) {
        appendRaw("Selección no válida.", "console-error");
        return;
      }
      editor.value = EXAMPLES[names[idx]];
      runCode();
    }

    editor.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value =
          editor.value.slice(0, start) + "  " + editor.value.slice(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
      }
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        runCode();
      }
    });

    runBtn.addEventListener("click", runCode);
    clearBtn.addEventListener("click", clearConsole);
    examplesBtn.addEventListener("click", showExamples);

    editor.value = `// Escribe código JavaScript a la izquierda
// y pulsa "Ejecutar" (o Ctrl+Enter).
// El resultado aparecerá aquí a la derecha, como en Node.js.

let mensaje = "Hola, alumnos";
console.log(mensaje);

let a = 6, b = 7;
console.log("La suma es", a + b);
`;

    runCode();
  </script>
</body>
</html>
